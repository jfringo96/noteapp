<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noteapp</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-menus">
      <button id="fileBtn" class="menu-btn" aria-haspopup="menu" aria-expanded="false">File</button>
      <button id="mapBtn" class="menu-btn" aria-haspopup="menu" aria-expanded="false"
              title="Every board in this collection">Map</button>
      <span id="collectionName" class="collection-name" title="The open collection"></span>
    </div>

    <div class="topbar-where">
      <button id="backBtn" class="icon-btn" title="Back" aria-label="Back">←</button>
      <nav id="crumbs" class="crumbs" aria-label="Breadcrumbs"></nav>
    </div>

    <input id="title" class="board-title" aria-label="Board title" spellcheck="false" maxlength="22">

    <div class="topbar-actions">
      <button id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">Redo</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="exportBtn" title="Export this board's pictures as a folder of JPEGs">Export</button>
      <button id="folderBtn" title="Open the folder your boards are saved in">Folder</button>
    </div>
  </header>

  <aside id="inspector" class="inspector is-empty" aria-label="Selected card"></aside>

  <main id="scroller" class="scroller">
    <div id="canvas" class="canvas"></div>
  </main>

  <div id="picker" class="picker" role="menu" aria-label="Add a card" hidden></div>
  <div id="fileMenu" class="menu" role="menu" aria-label="File" hidden></div>
  <div id="map" class="menu menu-map" role="menu" aria-label="Map of every board" hidden></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-label="Picture viewer" hidden>
    <div class="lightbox-stage">
      <img class="lightbox-image" alt="">
    </div>

    <button class="lightbox-prev" type="button" aria-label="Previous picture">‹</button>
    <button class="lightbox-next" type="button" aria-label="Next picture">›</button>
    <button class="lightbox-close" type="button" aria-label="Close">×</button>

    <div class="lightbox-bar">
      <span class="lightbox-caption"></span>
      <span class="lightbox-counter"></span>
    </div>
  </div>

  <div id="dialog" class="dialog-backdrop" hidden></div>

  <p id="empty" class="empty-state">Double-click anywhere to add a card, or drop in an image</p>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
