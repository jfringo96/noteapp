<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Board — prototype</title>
<!-- Empty data: icon so the browser never fires a /favicon.ico request. No network, at all. -->
<link rel="icon" href="data:,">
<style>
/* ---------------------------------------------------------------------------
   Tokens
   One accent only (muted ochre). Dark ground so photographs and colour
   swatches read accurately; cards are warm off-white paper above it.
--------------------------------------------------------------------------- */
:root{
  --ground:        #15181b;
  --ground-line:   rgba(255,255,255,.065);
  --bar:           #1c2025;
  --bar-2:         #23282e;
  --bar-line:      #2e343b;
  --ink:           #d9dee3;
  --ink-dim:       #8b939c;
  --ink-faint:     #666e77;

  --paper:         #f4f1e9;
  --paper-line:    #ddd6c6;
  --paper-ink:     #23211d;
  --paper-ink-dim: #6f6961;

  --accent:        #bd8a55;
  --accent-soft:   rgba(189,138,85,.28);
  --danger:        #b9614f;

  --fs-xs:  11.5px;
  --fs-sm:  13px;
  --fs-base:15px;
  --fs-lg:  16.5px;

  --radius: 10px;
  --grip:   22px;
  --shadow: 0 1px 1px rgba(0,0,0,.30), 0 10px 22px -8px rgba(0,0,0,.62);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
}

*{ box-sizing:border-box; }

html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font);
  font-size:var(--fs-base);
  -webkit-text-size-adjust:100%;
}

body{ display:flex; flex-direction:column; }

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* ---------------------------------------------------------------------------
   Top bar
--------------------------------------------------------------------------- */
.bar{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:7px 12px;
  padding-top:calc(7px + env(safe-area-inset-top, 0px));
  background:var(--bar);
  border-bottom:1px solid var(--bar-line);
  z-index:100;
}

.bar-left{ display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto; }

.back{
  flex:none;
  font:inherit;
  font-size:15px;
  line-height:1;
  color:var(--ink-dim);
  background:transparent;
  border:0;
  border-radius:6px;
  padding:6px 8px;
  cursor:pointer;
  margin-left:3px;
}
.back:hover:not(:disabled){ background:var(--bar-2); color:var(--ink); }
.back:disabled{ color:#3d444c; cursor:default; }

.mark{
  width:13px; height:13px; flex:none;
  border-radius:3px;
  background:var(--accent);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}

.title{
  font:inherit;
  font-size:var(--fs-lg);
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--ink);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  padding:4px 7px;
  flex:0 1 22ch;
  width:auto;
  min-width:7ch;
  max-width:22ch;
}
.title:hover{ border-color:var(--bar-line); }
.title:focus{ border-color:var(--accent); outline:none; background:var(--bar-2); }

.bar-right{ display:flex; align-items:center; gap:8px; flex:none; }

.group{
  display:flex;
  gap:4px;
  padding:3px;
  background:var(--bar-2);
  border:1px solid var(--bar-line);
  border-radius:8px;
}

.btn{
  font:inherit;
  font-size:var(--fs-sm);
  line-height:1;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:5px;
  padding:7px 10px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .12s ease, color .12s ease;
}
.btn:hover:not(:disabled){ background:#30363d; }
.btn:active:not(:disabled){ background:#3a4149; }
.btn:disabled{ color:var(--ink-faint); cursor:default; }
.btn.icon{ padding:7px 9px; font-size:15px; }

/* ---------------------------------------------------------------------------
   Canvas
   Fixed 3000x3000 area inside a scroller. Panning is native scroll.
--------------------------------------------------------------------------- */
.scroller{
  flex:1 1 auto;
  overflow:auto;
  position:relative;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.scroller::-webkit-scrollbar{ width:11px; height:11px; }
.scroller::-webkit-scrollbar-thumb{
  background:#333a42; border-radius:6px; border:3px solid var(--ground);
}
.scroller::-webkit-scrollbar-thumb:hover{ background:#414a53; }
.scroller::-webkit-scrollbar-corner{ background:var(--ground); }

.canvas{
  position:relative;
  width:3000px;
  height:3000px;
  background-color:var(--ground);
  background-image:radial-gradient(circle at 1px 1px, var(--ground-line) 1px, transparent 0);
  background-size:26px 26px;
}
.canvas.drop-active{
  box-shadow:inset 0 0 0 2px var(--accent-soft);
}
/* Programmatic focus target after navigating — a ring round 3000px is no use. */
.canvas:focus{ outline:none; }

.sr-only{
  position:absolute;
  width:1px; height:1px;
  padding:0; margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

/* ---------------------------------------------------------------------------
   Cards
--------------------------------------------------------------------------- */
.card{
  position:absolute;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  color:var(--paper-ink);
  /* Cards are light even though the page is dark — without this, native
     checkboxes and the colour input render in the page's dark scheme. */
  color-scheme:light;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:box-shadow .14s ease;
}
.card.selected{
  box-shadow:0 0 0 2px var(--accent), var(--shadow);
}
.card.dragging{
  box-shadow:0 0 0 2px var(--accent), 0 2px 4px rgba(0,0,0,.3), 0 22px 40px -10px rgba(0,0,0,.7);
  transition:none;
}
/* Board card armed to receive a card dragged over it. */
.card.drop-into{
  box-shadow:0 0 0 3px var(--accent), 0 0 0 9px var(--accent-soft), var(--shadow);
}
.card.drop-into .board-open{ background:#ddd2b8; }
.card.dragging.will-move{ opacity:.7; }

/* Drag handle. Dragging from the body would fight text selection in textareas. */
.grip{
  flex:none;
  height:var(--grip);
  display:flex;
  align-items:center;
  gap:2px;
  padding:0 3px 0 0;
  background:#e8e3d7;
  border-bottom:1px solid var(--paper-line);
  cursor:grab;
  touch-action:none;          /* required for pointer-drag on touch */
  user-select:none;
  -webkit-user-select:none;
}
.card.dragging .grip{ cursor:grabbing; }
.grip-rail{
  flex:1 1 auto;
  align-self:stretch;
  background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.20) 1px, transparent 0);
  background-size:5px 5px;
  background-position:center;
  background-repeat:repeat-x;
  min-width:10px;
}
.grip-btn{
  flex:none;
  font:inherit;
  font-size:var(--fs-xs);
  line-height:1;
  color:var(--paper-ink-dim);
  background:transparent;
  border:0;
  border-radius:4px;
  padding:4px 5px;
  cursor:pointer;
  touch-action:manipulation;
}
.grip-btn:hover{ background:rgba(0,0,0,.09); color:var(--paper-ink); }
.grip-btn.danger:hover{ background:rgba(185,97,79,.16); color:var(--danger); }
.grip-btn[aria-pressed="true"]{ background:var(--accent-soft); color:#6a4a24; }

.body{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.resize{
  position:absolute;
  right:0; bottom:0;
  width:20px; height:20px;
  cursor:nwse-resize;
  touch-action:none;          /* required for pointer-drag on touch */
  display:none;
  z-index:2;
}
.card.selected .resize{ display:block; }
.resize::after{
  content:"";
  position:absolute;
  right:3px; bottom:3px;
  width:9px; height:9px;
  border-right:2px solid var(--accent);
  border-bottom:2px solid var(--accent);
  border-bottom-right-radius:3px;
}

/* --- text card ------------------------------------------------------------ */
.text-field{
  flex:1 1 auto;
  width:100%;
  font:inherit;
  font-size:var(--fs-base);
  line-height:1.55;
  color:var(--paper-ink);
  background:transparent;
  border:0;
  outline:none;
  resize:none;
  padding:9px 11px;
  overflow:auto;
}
.text-field::placeholder{ color:var(--paper-ink-dim); }
.text-field:focus{ box-shadow:inset 0 0 0 2px var(--accent-soft); }

/* --- list card ------------------------------------------------------------ */
.rows{
  flex:1 1 auto;
  overflow:auto;
  padding:6px 8px 8px;
}
.row{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:26px;
}
.row .bullet{
  flex:none;
  width:15px;
  text-align:center;
  color:var(--paper-ink-dim);
  font-size:var(--fs-base);
  line-height:1;
  user-select:none;
}
.row input[type="checkbox"]{
  flex:none;
  width:15px; height:15px;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}
.row-input{
  flex:1 1 auto;
  min-width:0;
  font:inherit;
  font-size:var(--fs-sm);
  line-height:1.5;
  color:var(--paper-ink);
  background:transparent;
  border:0;
  outline:none;
  padding:4px 4px;
  border-radius:4px;
}
.row-input::placeholder{ color:var(--paper-ink-dim); }
.row-input:focus{ box-shadow:inset 0 0 0 2px var(--accent-soft); }
.row.checked .row-input{ text-decoration:line-through; color:var(--paper-ink-dim); }

/* --- image card ----------------------------------------------------------- */
.image-wrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e6e1d5;
}
.image-wrap img{
  width:100%; height:100%;
  object-fit:contain;
  display:block;
}
.image-empty{
  font-size:var(--fs-sm);
  color:var(--paper-ink-dim);
}

/* --- swatch card ---------------------------------------------------------- */
.swatch-block{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  margin:8px 8px 0;
  border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
}
.swatch-colour{
  position:absolute;
  inset:0;
  width:100%; height:100%;
  opacity:0;
  border:0; padding:0;
  cursor:pointer;
}
.swatch-colour:focus-visible + .swatch-ring{
  position:absolute; inset:0;
  border-radius:6px;
  box-shadow:0 0 0 2px var(--accent), inset 0 0 0 2px rgba(255,255,255,.5);
}
.swatch-foot{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px 8px;
}
.swatch-hex{
  flex:none;
  font-size:var(--fs-xs);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  color:var(--paper-ink-dim);
  text-transform:uppercase;
}
.swatch-label{
  flex:1 1 auto;
  min-width:0;
  font:inherit;
  font-size:var(--fs-sm);
  color:var(--paper-ink);
  background:transparent;
  border:0;
  outline:none;
  padding:3px 4px;
  border-radius:4px;
  text-align:right;
}
.swatch-label::placeholder{ color:var(--paper-ink-dim); }
.swatch-label:focus{ box-shadow:inset 0 0 0 2px var(--accent-soft); text-align:left; }

/* --- board card ----------------------------------------------------------
   A door, not content: tinted panel, accent hinge down the leading edge,
   enter glyph, and an arrow out to the right.
--------------------------------------------------------------------------- */
.card-board .body{ padding:0; }

.board-open{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:#eae3d4;
  border-left:3px solid var(--accent);
  cursor:pointer;
  transition:background .12s ease;
}
.board-open:hover{ background:#e3dbc8; }
.board-open:focus-visible{ outline:2px solid var(--accent); outline-offset:-3px; }

.board-glyph{
  flex:none;
  display:flex;
  color:var(--accent);
}
.board-meta{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.board-title{
  font:inherit;
  font-size:var(--fs-base);
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--paper-ink);
  background:transparent;
  border:0;
  outline:none;
  padding:2px 4px;
  margin-left:-4px;
  border-radius:4px;
  width:100%;
  min-width:0;
  cursor:text;
}
.board-title:focus{ background:var(--paper); box-shadow:inset 0 0 0 2px var(--accent-soft); }
/* Unselected, the whole body opens the board — the title must not look or
   behave like a field. Select the card first (grip bar) to rename. */
.card-board.selected .board-title:hover{ background:rgba(0,0,0,.05); }
.card-board:not(.selected) .board-title{ cursor:pointer; }
.board-count{
  font-size:var(--fs-xs);
  color:var(--paper-ink-dim);
  padding-left:0;
}
.board-arrow{
  flex:none;
  font-size:15px;
  line-height:1;
  color:var(--accent);
  opacity:.75;
}

.board-open.broken{
  background:rgba(185,97,79,.12);
  border-left-color:var(--danger);
  cursor:default;
}
.board-open.broken:hover{ background:rgba(185,97,79,.12); }
.board-open.broken .board-glyph{ color:var(--danger); }
.board-broken-title{
  font-size:var(--fs-sm);
  font-weight:600;
  color:var(--danger);
}
.board-broken-id{
  font-size:var(--fs-xs);
  color:var(--paper-ink-dim);
  word-break:break-all;
}

/* ---------------------------------------------------------------------------
   Breadcrumbs
   A record of the route clicked, not a position in a tree.
--------------------------------------------------------------------------- */
.crumbs{
  display:flex;
  align-items:center;
  gap:2px;
  min-width:0;
  flex:0 1 auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.crumbs::-webkit-scrollbar{ display:none; }

.crumb{
  font:inherit;
  font-size:var(--fs-sm);
  color:var(--ink-dim);
  background:transparent;
  border:0;
  border-radius:5px;
  padding:5px 6px;
  cursor:pointer;
  white-space:nowrap;
  max-width:15ch;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:background .12s ease, color .12s ease;
}
.crumb:hover{ background:var(--bar-2); color:var(--ink); }
.crumb-sep{
  flex:none;
  font-size:var(--fs-sm);
  color:var(--ink-faint);
  user-select:none;
}
.crumb-more{
  flex:none;
  font-size:var(--fs-sm);
  color:var(--ink-faint);
  padding:0 2px;
  user-select:none;
}

/* ---------------------------------------------------------------------------
   Board switcher
--------------------------------------------------------------------------- */
.switcher{
  position:fixed;
  z-index:700;
  min-width:230px;
  max-width:min(320px, calc(100vw - 20px));
  max-height:min(60vh, 420px);
  overflow-y:auto;
  padding:4px;
  background:var(--bar-2);
  border:1px solid var(--bar-line);
  border-radius:9px;
  box-shadow:0 14px 34px -8px rgba(0,0,0,.75);
}
.switcher-item{
  display:flex;
  align-items:center;
  gap:2px;
}
.switcher-item:hover{ background:#333a42; border-radius:5px; }

.switcher-del{
  flex:none;
  font:inherit;
  font-size:14px;
  line-height:1;
  color:var(--ink-faint);
  background:transparent;
  border:0;
  border-radius:5px;
  padding:7px 8px;
  cursor:pointer;
}
.switcher-del:hover{ background:rgba(185,97,79,.22); color:var(--danger); }
.switcher-del:disabled{ opacity:.3; cursor:default; }
.switcher-del:disabled:hover{ background:transparent; color:var(--ink-faint); }

.switcher-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex:1 1 auto;
  min-width:0;
  font:inherit;
  font-size:var(--fs-sm);
  text-align:left;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:5px;
  padding:8px 9px;
  cursor:pointer;
}
.switcher-row:hover{ background:#333a42; }
.switcher-row[aria-current="true"]{ background:var(--accent-soft); }
.switcher-new{ width:100%; }
.switcher-name{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.switcher-count{
  flex:none;
  font-size:var(--fs-xs);
  font-variant-numeric:tabular-nums;
  color:var(--ink-faint);
}
.switcher-sep{
  height:1px;
  margin:4px 6px;
  background:var(--bar-line);
}
.switcher-new{ color:var(--accent); font-weight:600; }

/* ---------------------------------------------------------------------------
   Card-type picker (double-click / double-tap on empty canvas)
--------------------------------------------------------------------------- */
.picker{
  position:absolute;
  z-index:500;
  display:flex;
  flex-direction:column;
  padding:4px;
  min-width:132px;
  background:var(--bar-2);
  border:1px solid var(--bar-line);
  border-radius:9px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.75);
}
.picker button{
  font:inherit;
  font-size:var(--fs-sm);
  text-align:left;
  color:var(--ink);
  background:transparent;
  border:0;
  border-radius:5px;
  padding:8px 10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:9px;
}
.picker button:hover{ background:#333a42; }
.picker .dot{
  width:9px; height:9px; border-radius:2px; flex:none;
  background:var(--accent); opacity:.85;
}

/* ---------------------------------------------------------------------------
   Chrome: unsaved notice, empty state, toast
--------------------------------------------------------------------------- */
.notice{
  position:fixed;
  left:12px;
  bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  z-index:200;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 11px;
  font-size:var(--fs-xs);
  line-height:1.35;
  color:var(--ink-dim);
  background:rgba(28,32,37,.9);
  border:1px solid var(--bar-line);
  border-radius:20px;
  pointer-events:none;
  max-width:calc(100vw - 24px);
}
.notice b{ color:var(--ink); font-weight:600; }
.notice .pip{
  width:6px; height:6px; border-radius:50%;
  background:var(--danger);
  flex:none;
}
.notice-short{ display:none; }

.empty{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:1;
}
.empty.show{ display:flex; }
.empty span{
  font-size:var(--fs-sm);
  color:var(--ink-faint);
  background:rgba(21,24,27,.8);
  padding:8px 14px;
  border-radius:20px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(52px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  z-index:600;
  padding:9px 15px;
  font-size:var(--fs-sm);
  color:var(--ink);
  background:var(--bar-2);
  border:1px solid var(--bar-line);
  border-radius:8px;
  box-shadow:0 10px 26px -8px rgba(0,0,0,.7);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.toast.show{ opacity:1; }

/* ---------------------------------------------------------------------------
   Narrow screens
--------------------------------------------------------------------------- */
@media (max-width: 760px){
  .bar{ flex-wrap:wrap; gap:7px; padding:6px 9px; padding-top:calc(6px + env(safe-area-inset-top, 0px)); }
  .bar-left{ flex:1 1 100%; }
  .title{ max-width:none; }
  .bar-right{
    flex:1 1 100%;
    overflow-x:auto;
    justify-content:flex-start;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .bar-right::-webkit-scrollbar{ display:none; }
  .btn{ padding:8px 11px; }
  .notice{ font-size:11px; padding:5px 9px; }
  .notice-long{ display:none; }
  .notice-short{ display:inline; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <span class="mark" aria-hidden="true"></span>
    <button class="back" id="backBtn" aria-label="Back" title="Back to the previous board"
            disabled>&#8592;</button>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <input id="title" class="title" type="text" value="Home" aria-label="Board title" spellcheck="false">
  </div>

  <div class="bar-right">
    <div class="group" role="group" aria-label="Boards">
      <button class="btn" id="boardsBtn" aria-haspopup="menu" aria-expanded="false"
              title="Switch board">Boards &#9662;</button>
    </div>
    <div class="group" role="group" aria-label="Add card">
      <button class="btn" data-add="text">Text</button>
      <button class="btn" data-add="list">List</button>
      <button class="btn" data-add="image">Image</button>
      <button class="btn" data-add="swatch">Swatch</button>
      <button class="btn" data-add="board">Board</button>
    </div>
    <div class="group" role="group" aria-label="History">
      <button class="btn icon" id="undoBtn" aria-label="Undo" title="Undo (Ctrl/Cmd+Z)">&#8630;</button>
      <button class="btn icon" id="redoBtn" aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)">&#8631;</button>
    </div>
    <div class="group" role="group" aria-label="Transfer">
      <button class="btn" id="exportBtn" title="Download the board as JSON">Export</button>
      <button class="btn" id="importBtn" title="Load a board from a JSON file">Import</button>
    </div>
  </div>
</header>

<div class="scroller" id="scroller">
  <div class="canvas" id="canvas" tabindex="-1" aria-label="Board canvas"></div>
  <div class="empty" id="empty"><span>Double-click the canvas to add a card</span></div>
</div>

<p class="notice" role="status">
  <span class="pip" aria-hidden="true"></span>
  <span class="notice-long"><b>Nothing is saved.</b> A refresh clears the board — use Export to keep it.</span>
  <span class="notice-short"><b>Nothing is saved</b> — Export to keep it.</span>
</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="announce" role="status" aria-live="polite"></div>

<input type="file" id="jsonInput" accept="application/json,.json" hidden>
<input type="file" id="imageInput" accept="image/*" multiple hidden>

<script>
"use strict";

/* ===========================================================================
   Board prototype — Phase 1, no persistence.

   Everything the real app should be able to lift lives above the "wiring"
   line: the state object, applyChange(), the history model, and the gesture
   handlers. The DOM building below is prototype scaffolding.
   =========================================================================== */

const CANVAS_SIZE   = 3000;
const HISTORY_LIMIT = 50;

const MIN_SIZE = {
  text:   { w: 140, h: 84 },
  list:   { w: 150, h: 74 },
  image:  { w:  80, h: 60 },
  swatch: { w: 112, h: 96 },
  board:  { w: 160, h: 82 }
};

const DEFAULT_SIZE = {
  text:   { w: 260, h: 150 },
  list:   { w: 250, h: 150 },
  image:  { w: 260, h: 180 },
  swatch: { w: 150, h: 150 },
  board:  { w: 230, h: 96 }
};

const CARD_TYPES = ["text", "list", "image", "swatch", "board"];

/* How many crumbs to keep. Boards can point at each other in a cycle, so the
   trail is capped rather than allowed to grow with every lap. */
const TRAIL_MAX = 10;

const uid = prefix => prefix + "_" + Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* ---------------------------------------------------------------------------
   State
   One plain object holds everything. Nothing else is authoritative.

   Boards are stored FLAT, keyed by id. A board never contains another
   board's cards — nesting is by reference only (a card holding a
   targetBoardId), so a board can be linked from several places and two
   boards can point at each other without the data becoming a tree.
--------------------------------------------------------------------------- */

let state = {
  currentBoardId: "b_home",
  boards: {
    b_home: { id: "b_home", title: "Home", cards: [] }
  }
};

const currentBoard = () => state.boards[state.currentBoardId];

const undoStack = [];
const redoStack = [];

let selectedId = null;

/* Pending text-edit snapshot. Typing writes straight into state without
   touching history; the snapshot taken when an editor gains focus is pushed
   once, on blur, if anything actually changed. One history entry per
   editing session. */
let editSnapshot = null;

/* ---------------------------------------------------------------------------
   applyChange — the single mutation entry point
--------------------------------------------------------------------------- */

/* Snapshots clone the WHOLE state, currentBoardId included. So undoing an
   edit that was made on another board navigates back to that board to show
   you the change, rather than silently altering something off-screen.
   Navigation itself never goes through here — it is not undoable. */
function applyChange(mutator) {
  commitEdit();                                 // seal any in-flight typing first
  const before = structuredClone(state);
  mutator();
  undoStack.push(before);
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack.length = 0;
  render();
}

/* Begin an editing session. No-op if one is already open, so a focus event
   and the first input event can both call it safely. */
function stashEdit() {
  if (editSnapshot) return;
  editSnapshot = { snap: structuredClone(state), json: JSON.stringify(state) };
}

/* End an editing session. Pushes exactly one history entry, and only if the
   content really moved. Does not render — the DOM is already correct. */
function commitEdit() {
  if (!editSnapshot) return;
  const { snap, json } = editSnapshot;
  editSnapshot = null;
  if (json === JSON.stringify(state)) return;
  undoStack.push(snap);
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack.length = 0;
  updateChrome();
}

/* Both jumps land on the board the change concerned, so nothing is ever
   applied off-screen.

   applyChange() never navigates, so the board a change concerned is exactly
   the currentBoardId inside the snapshot it recorded. Undo gets that for
   free by popping. Redo does not — its entry is built at undo time from live
   state, which names wherever you were standing then — so we stamp it with
   the board from the entry being undone. One field copy, no diffing. */
function undo() {
  commitEdit();
  if (!undoStack.length) return;
  const target = undoStack[undoStack.length - 1];
  const inverse = structuredClone(state);
  inverse.currentBoardId = target.currentBoardId;
  redoStack.push(inverse);
  state = undoStack.pop();
  afterHistoryJump();
}

function redo() {
  commitEdit();
  if (!redoStack.length) return;
  const target = redoStack[redoStack.length - 1];
  const inverse = structuredClone(state);
  inverse.currentBoardId = target.currentBoardId;
  undoStack.push(inverse);
  state = redoStack.pop();
  afterHistoryJump();
}

function afterHistoryJump() {
  /* The snapshot can name a board that this jump removed. */
  if (!currentBoard()) state.currentBoardId = Object.keys(state.boards)[0];
  if (selectedId && !getCard(selectedId)) selectedId = null;
  titleInput.value = currentBoard().title;
  render();
}

const getCard = id => currentBoard().cards.find(c => c.id === id) || null;

/* ---------------------------------------------------------------------------
   Selection
   Single selection. Selecting brings the card to the end of the cards array
   (= front). Deliberately not a history entry — see notes in the README
   section of the commit message.
--------------------------------------------------------------------------- */

function select(id) {
  if (selectedId === id) return;
  selectedId = id;
  if (id) {
    const cards = currentBoard().cards;
    const i = cards.findIndex(c => c.id === id);
    if (i > -1 && i !== cards.length - 1) {
      cards.push(cards.splice(i, 1)[0]);
    }
  }
  refreshStacking();
}

/* Reorders z-index and the selection ring in place. Never rebuilds the DOM —
   rebuilding on pointerdown would destroy the element the click is landing on
   and swallow focus for textareas and inputs. */
function refreshStacking() {
  currentBoard().cards.forEach((card, i) => {
    const el = elements.get(card.id);
    if (!el) return;
    const isSelected = card.id === selectedId;
    el.style.zIndex = String(i + 1);
    el.classList.toggle("selected", isSelected);
    /* Board names are only editable on a selected card — see buildBoardLink. */
    const boardTitle = el.querySelector(".board-title");
    if (boardTitle) boardTitle.readOnly = !isSelected;
  });
}

function deleteCard(id) {
  if (!getCard(id)) return;
  applyChange(() => {
    const b = currentBoard();
    b.cards = b.cards.filter(c => c.id !== id);
  });
  if (selectedId === id) selectedId = null;
  refreshStacking();
  updateChrome();
}

/* ---------------------------------------------------------------------------
   Card creation
--------------------------------------------------------------------------- */

function makeCard(type, x, y, extra) {
  const size = DEFAULT_SIZE[type];
  const card = {
    id: uid("c"),
    type,
    x: 0, y: 0,
    w: size.w,
    h: size.h
  };

  if (type === "text")   Object.assign(card, { text: "" });
  if (type === "list")   Object.assign(card, { items: [{ id: uid("i"), text: "", checked: false }], checkable: false });
  if (type === "image")  Object.assign(card, { dataUrl: "", alt: "" });
  if (type === "swatch") Object.assign(card, { colour: "#c9a227", label: "" });
  if (type === "board")  Object.assign(card, { targetBoardId: "" });

  Object.assign(card, extra || {});

  card.x = Math.round(clamp(x, 0, CANVAS_SIZE - card.w));
  card.y = Math.round(clamp(y, 0, CANVAS_SIZE - card.h));
  return card;
}

function addCard(type, x, y, extra) {
  const card = makeCard(type, x, y, extra);
  applyChange(() => { currentBoard().cards.push(card); });
  select(card.id);
  updateChrome();

  const el = elements.get(card.id);
  if (el) {
    if (type === "text")   el.querySelector(".text-field")?.focus();
    if (type === "list")   el.querySelector(".row-input")?.focus();
    if (type === "swatch") el.querySelector(".swatch-label")?.focus();
  }
  return card.id;
}

/* Fresh ids all the way down, so a copy shares nothing with its original.
   A board card is duplicated as a LINK — the target board is not copied,
   which is the whole point of nesting by reference. */
function cloneCard(card) {
  const copy = structuredClone(card);
  copy.id = uid("c");
  if (Array.isArray(copy.items)) {
    copy.items = copy.items.map(item => Object.assign({}, item, { id: uid("i") }));
  }
  return copy;
}

function duplicateSelected() {
  const src = getCard(selectedId);
  if (!src) return;
  const copy = cloneCard(src);
  copy.x = clamp(src.x + 24, 0, CANVAS_SIZE - copy.w);
  copy.y = clamp(src.y + 24, 0, CANVAS_SIZE - copy.h);
  applyChange(() => { currentBoard().cards.push(copy); });
  select(copy.id);
  updateChrome();
}

/* Card clipboard — separate from the system clipboard, which only carries
   images here. Cut/paste is the keyboard route for moving a card to another
   board; dragging onto a board card is the direct one. */
let cardClipboard = null;

function cutSelected(remove) {
  const src = getCard(selectedId);
  if (!src) return false;
  cardClipboard = structuredClone(src);
  if (remove) {
    deleteCard(src.id);
    toast("Cut — paste it on any board");
  } else {
    toast("Copied");
  }
  return true;
}

function pasteCard() {
  if (!cardClipboard) return false;
  const copy = cloneCard(cardClipboard);
  const pt = viewportCentre(copy.type);
  copy.x = clamp(Math.round(pt.x), 0, CANVAS_SIZE - copy.w);
  copy.y = clamp(Math.round(pt.y), 0, CANVAS_SIZE - copy.h);
  applyChange(() => { currentBoard().cards.push(copy); });
  select(copy.id);
  updateChrome();
  return true;
}

/* Where a toolbar-created card goes: the middle of what you are looking at. */
function viewportCentre(type) {
  const size = DEFAULT_SIZE[type];
  return {
    x: scroller.scrollLeft + scroller.clientWidth  / 2 - size.w / 2,
    y: scroller.scrollTop  + scroller.clientHeight / 2 - size.h / 2
  };
}

/* ---------------------------------------------------------------------------
   Rendering
   Full rebuild of the card layer. Cheap at this scale, and only ever runs on
   discrete changes — never mid-keystroke, never mid-gesture.
--------------------------------------------------------------------------- */

const scroller   = document.getElementById("scroller");
const canvas     = document.getElementById("canvas");
const titleInput = document.getElementById("title");
const crumbs     = document.getElementById("crumbs");
const boardsBtn  = document.getElementById("boardsBtn");
const backBtn    = document.getElementById("backBtn");
const announceEl = document.getElementById("announce");
const undoBtn    = document.getElementById("undoBtn");
const redoBtn    = document.getElementById("redoBtn");
const emptyState = document.getElementById("empty");
const toastEl    = document.getElementById("toast");
const jsonInput  = document.getElementById("jsonInput");
const imageInput = document.getElementById("imageInput");

const elements = new Map();   // card id -> element

/* Where you were looking on each board. Deliberately NOT in `state`: it is
   view position, not document content, so it stays out of history, out of
   exports, and out of every snapshot clone. */
const scrollMemory = new Map();   // board id -> {x, y}
let displayedBoardId = null;      // the board render() last drew

function render() {
  /* Any board switch comes through here, so this is the one place that has
     to bank the outgoing scroll position. */
  const switching = displayedBoardId !== state.currentBoardId;
  if (switching && displayedBoardId) {
    scrollMemory.set(displayedBoardId, { x: scroller.scrollLeft, y: scroller.scrollTop });
  }

  elements.forEach(el => el.remove());
  elements.clear();

  currentBoard().cards.forEach((card, i) => {
    const el = buildCard(card);
    el.style.zIndex = String(i + 1);
    elements.set(card.id, el);
    canvas.appendChild(el);
  });

  refreshStacking();
  currentBoard().cards.forEach(card => grow(card, elements.get(card.id)));
  updateChrome();

  if (switching) {
    displayedBoardId = state.currentBoardId;
    const seen = scrollMemory.get(displayedBoardId);
    if (seen) { scroller.scrollLeft = seen.x; scroller.scrollTop = seen.y; }
    else scrollToContent();
  }
}

function updateChrome() {
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
  backBtn.disabled = !backStack.some(id => !!state.boards[id]);
  emptyState.classList.toggle("show", currentBoard().cards.length === 0);
  if (document.activeElement !== titleInput) titleInput.value = currentBoard().title;
  renderBreadcrumbs();
  if (switcherEl) openSwitcher();          // keep counts and names live
}

/* Cards only ever grow to fit their content, never shrink — a height you set
   by dragging is respected. Writes h straight to state with no history entry,
   same rule as typing. */
function grow(card, el) {
  if (!el || !el.__scrollHost) return;
  const host = el.__scrollHost;
  const overflow = host.scrollHeight - host.clientHeight;
  if (overflow > 0) {
    card.h = Math.min(CANVAS_SIZE - card.y, card.h + overflow);
    el.style.height = card.h + "px";
  }
}

function buildCard(card) {
  const el = document.createElement("div");
  el.className = "card card-" + card.type;
  el.dataset.id = card.id;
  el.style.left   = card.x + "px";
  el.style.top    = card.y + "px";
  el.style.width  = card.w + "px";
  el.style.height = card.h + "px";

  el.appendChild(buildGrip(card, el));

  const body = document.createElement("div");
  body.className = "body";
  el.appendChild(body);
  el.__body = body;

  if (card.type === "text")   buildText(card, el, body);
  if (card.type === "list")   buildList(card, el, body);
  if (card.type === "image")  buildImage(card, el, body);
  if (card.type === "swatch") buildSwatch(card, el, body);
  if (card.type === "board")  buildBoardLink(card, el, body);

  const handle = document.createElement("div");
  handle.className = "resize";
  handle.setAttribute("aria-hidden", "true");
  handle.addEventListener("pointerdown", e => startResize(e, card, el, handle));
  el.appendChild(handle);

  /* Selecting must not preventDefault — inputs inside still need the click. */
  el.addEventListener("pointerdown", () => select(card.id));

  return el;
}

function buildGrip(card, el) {
  const grip = document.createElement("div");
  grip.className = "grip";

  const rail = document.createElement("div");
  rail.className = "grip-rail";
  grip.appendChild(rail);

  if (card.type === "list") {
    const toggle = document.createElement("button");
    toggle.className = "grip-btn";
    toggle.type = "button";
    toggle.textContent = card.checkable ? "☑" : "•";
    toggle.title = card.checkable ? "Switch to bullets" : "Switch to checkboxes";
    toggle.setAttribute("aria-label", toggle.title);
    toggle.setAttribute("aria-pressed", String(card.checkable));
    toggle.addEventListener("pointerdown", e => e.stopPropagation());
    toggle.addEventListener("click", () => {
      applyChange(() => { getCard(card.id).checkable = !card.checkable; });
    });
    grip.appendChild(toggle);
  }

  /* A delete affordance matters on touch, where there is no Delete key. */
  const del = document.createElement("button");
  del.className = "grip-btn danger";
  del.type = "button";
  del.textContent = "×";
  del.title = "Delete card";
  del.setAttribute("aria-label", "Delete card");
  del.addEventListener("pointerdown", e => e.stopPropagation());
  del.addEventListener("click", () => deleteCard(card.id));
  grip.appendChild(del);

  grip.addEventListener("pointerdown", e => startDrag(e, card, el, grip));
  return grip;
}

/* --- text ----------------------------------------------------------------- */

function buildText(card, el, body) {
  const ta = document.createElement("textarea");
  ta.className = "text-field";
  ta.value = card.text;
  ta.placeholder = "Note…";
  ta.spellcheck = false;
  ta.setAttribute("aria-label", "Card text");

  ta.addEventListener("focus", stashEdit);
  ta.addEventListener("input", () => {
    stashEdit();                          // before the write, so the snapshot is pre-change
    getCard(card.id).text = ta.value;
    grow(card, el);                       // auto-grow, no re-render, focus intact
  });
  ta.addEventListener("blur", commitEdit);

  body.appendChild(ta);
  el.__scrollHost = ta;
}

/* --- list ----------------------------------------------------------------- */

function buildList(card, el, body) {
  const rows = document.createElement("div");
  rows.className = "rows";
  card.items.forEach(item => rows.appendChild(buildRow(card, el, item)));
  body.appendChild(rows);
  el.__scrollHost = rows;
}

function buildRow(card, el, item) {
  const row = document.createElement("div");
  row.className = "row" + (card.checkable && item.checked ? " checked" : "");
  row.dataset.item = item.id;

  if (card.checkable) {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!item.checked;
    box.setAttribute("aria-label", "Done");
    box.addEventListener("pointerdown", e => e.stopPropagation());
    box.addEventListener("change", () => {
      applyChange(() => {
        const target = getCard(card.id).items.find(i => i.id === item.id);
        if (target) target.checked = box.checked;
      });
    });
    row.appendChild(box);
  } else {
    const dot = document.createElement("span");
    dot.className = "bullet";
    dot.textContent = "•";
    dot.setAttribute("aria-hidden", "true");
    row.appendChild(dot);
  }

  const input = document.createElement("input");
  input.type = "text";
  input.className = "row-input";
  input.value = item.text;
  input.placeholder = "Item";
  input.spellcheck = false;
  input.setAttribute("aria-label", "List item");

  input.addEventListener("focus", stashEdit);
  input.addEventListener("input", () => {
    stashEdit();
    const target = getCard(card.id).items.find(i => i.id === item.id);
    if (target) target.text = input.value;
  });
  input.addEventListener("blur", commitEdit);
  input.addEventListener("keydown", e => onRowKey(e, card, item, input));

  row.appendChild(input);
  return row;
}

function onRowKey(e, card, item, input) {
  const items = getCard(card.id).items;
  const idx = items.findIndex(i => i.id === item.id);
  if (idx < 0) return;

  if (e.key === "Enter") {
    e.preventDefault();
    const newId = uid("i");
    applyChange(() => {
      getCard(card.id).items.splice(idx + 1, 0, { id: newId, text: "", checked: false });
    });
    focusItem(card.id, newId, "end");
    return;
  }

  if (e.key === "Backspace" && input.value === "" && idx > 0) {
    e.preventDefault();
    const prevId = items[idx - 1].id;
    applyChange(() => {
      getCard(card.id).items.splice(idx, 1);
    });
    focusItem(card.id, prevId, "end");
    return;
  }

  if (e.key === "ArrowUp" && idx > 0) {
    e.preventDefault();
    focusItem(card.id, items[idx - 1].id, "end");
    return;
  }

  if (e.key === "ArrowDown" && idx < items.length - 1) {
    e.preventDefault();
    focusItem(card.id, items[idx + 1].id, "end");
  }
}

function focusItem(cardId, itemId, where) {
  const el = elements.get(cardId);
  if (!el) return;
  const input = el.querySelector('[data-item="' + itemId + '"] .row-input');
  if (!input) return;
  input.focus();
  const pos = where === "end" ? input.value.length : 0;
  input.setSelectionRange(pos, pos);
}

/* --- image ---------------------------------------------------------------- */

function buildImage(card, el, body) {
  const wrap = document.createElement("div");
  wrap.className = "image-wrap";

  if (card.dataUrl) {
    const img = document.createElement("img");
    img.src = card.dataUrl;
    img.alt = card.alt || "";
    img.draggable = false;
    wrap.appendChild(img);
  } else {
    const note = document.createElement("span");
    note.className = "image-empty";
    note.textContent = "No image";
    wrap.appendChild(note);
  }

  body.appendChild(wrap);
}

/* --- swatch --------------------------------------------------------------- */

function buildSwatch(card, el, body) {
  const block = document.createElement("div");
  block.className = "swatch-block";
  block.style.background = card.colour;

  const picker = document.createElement("input");
  picker.type = "color";
  picker.className = "swatch-colour";
  picker.value = card.colour;
  picker.setAttribute("aria-label", "Swatch colour");
  picker.addEventListener("pointerdown", e => e.stopPropagation());

  const ring = document.createElement("span");
  ring.className = "swatch-ring";
  ring.setAttribute("aria-hidden", "true");

  const foot = document.createElement("div");
  foot.className = "swatch-foot";

  const hex = document.createElement("span");
  hex.className = "swatch-hex";
  hex.textContent = card.colour;

  const label = document.createElement("input");
  label.type = "text";
  label.className = "swatch-label";
  label.value = card.label;
  label.placeholder = "Label";
  label.spellcheck = false;
  label.setAttribute("aria-label", "Swatch label");
  label.addEventListener("focus", stashEdit);
  label.addEventListener("input", () => {
    stashEdit();
    getCard(card.id).label = label.value;
  });
  label.addEventListener("blur", commitEdit);

  /* Native colour pickers stream `input` while you drag and fire `change`
     when the dialog closes — the same open/commit shape as focus/blur. */
  picker.addEventListener("input", () => {
    stashEdit();
    getCard(card.id).colour = picker.value;
    block.style.background = picker.value;
    hex.textContent = picker.value;
  });
  picker.addEventListener("change", commitEdit);

  block.appendChild(picker);
  block.appendChild(ring);
  foot.appendChild(hex);
  foot.appendChild(label);
  body.appendChild(block);
  body.appendChild(foot);
}

/* --- board card ----------------------------------------------------------
   A link, not a container. The card holds only targetBoardId; the title and
   the count are read from the target board every render, so renaming a board
   updates every card pointing at it and nothing is ever duplicated.
--------------------------------------------------------------------------- */

const ENTER_GLYPH =
  '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">' +
  '<path d="M11.5 3.5H5.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h6" fill="none" ' +
  'stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
  '<path d="M13.5 7l3 3-3 3M16.5 10H8.5" fill="none" stroke="currentColor" ' +
  'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function buildBoardLink(card, el, body) {
  const target = state.boards[card.targetBoardId];

  const open = document.createElement("div");
  open.className = "board-open";

  const glyph = document.createElement("span");
  glyph.className = "board-glyph";
  glyph.innerHTML = ENTER_GLYPH;
  open.appendChild(glyph);

  const meta = document.createElement("div");
  meta.className = "board-meta";
  open.appendChild(meta);

  /* Dangling reference: show it plainly rather than throwing. Deleting a
     board is not possible in the prototype, but an imported file can carry
     a link to a board that is not in it. */
  if (!target) {
    open.classList.add("broken");
    const t = document.createElement("span");
    t.className = "board-broken-title";
    t.textContent = "Missing board";
    const idLine = document.createElement("span");
    idLine.className = "board-broken-id";
    idLine.textContent = card.targetBoardId || "no target set";
    meta.appendChild(t);
    meta.appendChild(idLine);
    body.appendChild(open);
    return;
  }

  const title = document.createElement("input");
  title.type = "text";
  title.className = "board-title";
  title.value = target.title;
  title.placeholder = "Board name";
  title.spellcheck = false;
  title.setAttribute("aria-label", "Board name");

  /* Two jobs, one surface. Unselected, the whole card body opens the board —
     including over the title, which is what the hand expects. Once the card
     is selected, the title becomes the rename field and swallows the click.
     Armed at pointerdown because the card's own pointerdown handler selects
     it before the click event lands. */
  let armed = false;
  title.addEventListener("pointerdown", () => { armed = selectedId === card.id; });
  title.addEventListener("click", e => {
    if (armed) e.stopPropagation();          // rename, do not navigate
  });
  title.addEventListener("focus", stashEdit);
  title.addEventListener("input", () => {
    stashEdit();
    const t = state.boards[card.targetBoardId];
    if (!t) return;
    t.title = title.value;
    refreshBoardLabels(title);          // other cards pointing here, and the crumbs
  });
  title.addEventListener("blur", commitEdit);
  title.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); title.blur(); }
  });

  const count = document.createElement("span");
  count.className = "board-count";
  count.textContent = cardCountLabel(target);

  meta.appendChild(title);
  meta.appendChild(count);

  const arrow = document.createElement("span");
  arrow.className = "board-arrow";
  arrow.textContent = "→";
  arrow.setAttribute("aria-hidden", "true");
  open.appendChild(arrow);

  open.setAttribute("role", "link");
  open.tabIndex = 0;
  open.title = "Open " + target.title;
  open.addEventListener("click", () => navigateTo(card.targetBoardId));
  open.addEventListener("keydown", e => {
    /* Only when the link itself has focus. Keystrokes inside the title input
       bubble up here, and a space in a board name is not an activation. */
    if (e.target !== open) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      navigateTo(card.targetBoardId);
    }
  });

  body.appendChild(open);
}

const cardCountLabel = b => b.cards.length + (b.cards.length === 1 ? " card" : " cards");

/* Keep every visible reference to a board title in sync while it is being
   typed, without a re-render — a re-render would kill the caret. */
function refreshBoardLabels(except) {
  currentBoard().cards.forEach(c => {
    if (c.type !== "board") return;
    const el = elements.get(c.id);
    const t = state.boards[c.targetBoardId];
    if (!el || !t) return;
    const input = el.querySelector(".board-title");
    if (input && input !== except) input.value = t.title;
    const count = el.querySelector(".board-count");
    if (count) count.textContent = cardCountLabel(t);
  });
  renderBreadcrumbs();
  if (document.activeElement !== titleInput) titleInput.value = currentBoard().title;
}

/* Creating a board card creates the board too, in one history entry. Note
   this mutates two boards at once — the current one gains a card, and a new
   board appears — which is the case afterHistoryJump() has to resolve. */
function addBoardCard(x, y) {
  const id = uid("b");
  const card = makeCard("board", x, y, { targetBoardId: id });
  applyChange(() => {
    state.boards[id] = { id: id, title: "New board", cards: [] };
    currentBoard().cards.push(card);
  });
  /* No modal: the card's own inline title field is the rename affordance, so
     open it pre-selected and let the first keystroke replace the placeholder. */
  select(card.id);
  updateChrome();
  const input = elements.get(card.id) && elements.get(card.id).querySelector(".board-title");
  if (input) { input.focus(); input.select(); }
}

/* Moves a card out of the current board and into another. One splice, one
   push, one history entry — the flat board map means nothing has to be
   re-parented. Position is carried across as-is. */
function moveCardToBoard(cardId, boardId) {
  const source = currentBoard();
  const card = source.cards.find(c => c.id === cardId);
  const destination = state.boards[boardId];
  if (!card || !destination || destination === source) return;

  applyChange(() => {
    const from = currentBoard();
    const i = from.cards.findIndex(c => c.id === cardId);
    if (i < 0) return;
    const [moved] = from.cards.splice(i, 1);
    moved.x = clamp(moved.x, 0, CANVAS_SIZE - moved.w);
    moved.y = clamp(moved.y, 0, CANVAS_SIZE - moved.h);
    state.boards[boardId].cards.push(moved);
  });

  if (selectedId === cardId) selectedId = null;   // it lives elsewhere now
  refreshStacking();
  updateChrome();
  toast("Moved to “" + (destination.title || "Untitled") + "”");
}

/* ---------------------------------------------------------------------------
   Navigation
   Never goes through applyChange() — moving between boards is not an
   undoable action.
--------------------------------------------------------------------------- */

let trail = ["b_home"];

/* Where you came from, so Back works even after a switcher jump reset the
   trail. A route record, like the trail — not a tree position. */
const backStack = [];
const BACK_MAX = 50;

/* opts.trail: "push" (default) | "reset" | "keep" (caller set it) |
                "repair" (leave it to normaliseTrail)
   opts.noBack: do not record where we came from (used by Back itself) */
function navigateTo(boardId, opts) {
  opts = opts || {};
  if (!state.boards[boardId]) return;
  /* Seal any open edit first. Otherwise its snapshot, taken on the board we
     are leaving, would later differ from the live state only by
     currentBoardId — and mere navigation would land in the undo stack. */
  commitEdit();
  if (boardId === state.currentBoardId) {
    closeSwitcher();
    renderBreadcrumbs();            // the trail may still have been truncated
    return;
  }

  if (!opts.noBack) {
    backStack.push(state.currentBoardId);
    if (backStack.length > BACK_MAX) backStack.shift();
  }

  state.currentBoardId = boardId;
  if (opts.trail === "reset") trail = [boardId];
  else if (opts.trail === "keep" || opts.trail === "repair") { /* left alone */ }
  else {
    trail.push(boardId);
    if (trail.length > TRAIL_MAX) trail.shift();
  }

  selectedId = null;
  closePicker();
  closeSwitcher();
  render();                          // restores this board's scroll position
  focusCanvas();
  announce("Now on " + currentBoard().title);
}

function goBack() {
  while (backStack.length) {
    const id = backStack.pop();
    if (state.boards[id]) {          // skip boards deleted since
      navigateTo(id, { trail: "repair", noBack: true });
      return;
    }
  }
  updateChrome();
}

/* Keyboard focus has to land somewhere after a navigation, or Tab restarts
   from the top of the document. */
function focusCanvas() {
  canvas.focus({ preventScroll: true });
}

function announce(message) {
  announceEl.textContent = message;
}

/* Repair the trail against reality: after an import, or an undo that jumped
   to another board, it can name boards that are gone or end somewhere other
   than where we are. */
function normaliseTrail() {
  trail = trail.filter(id => state.boards[id]);
  if (trail[trail.length - 1] !== state.currentBoardId) {
    const i = trail.lastIndexOf(state.currentBoardId);
    if (i > -1) trail.length = i + 1;
    else trail = [state.currentBoardId];
  }
  if (trail.length > TRAIL_MAX) trail = trail.slice(-TRAIL_MAX);
}

function renderBreadcrumbs() {
  normaliseTrail();
  crumbs.replaceChildren();

  /* Everything up to the last crumb is a button; the last crumb is the
     editable title input that already sits after this element. */
  trail.slice(0, -1).forEach((id, i) => {
    const b = state.boards[id];
    const crumb = document.createElement("button");
    crumb.type = "button";
    crumb.className = "crumb";
    crumb.textContent = b.title || "Untitled";
    crumb.title = "Back to " + (b.title || "Untitled");
    crumb.addEventListener("click", () => {
      trail.length = i + 1;                       // clicking a crumb truncates
      navigateTo(id, { trail: "keep" });
    });
    crumbs.appendChild(crumb);

    const sep = document.createElement("span");
    sep.className = "crumb-sep";
    sep.textContent = "/";
    sep.setAttribute("aria-hidden", "true");
    crumbs.appendChild(sep);
  });
}

/* ---------------------------------------------------------------------------
   Board switcher
--------------------------------------------------------------------------- */

let switcherEl = null;

function closeSwitcher() {
  if (!switcherEl) return;
  switcherEl.remove();
  switcherEl = null;
  boardsBtn.setAttribute("aria-expanded", "false");
}

function openSwitcher() {
  const wasOpen = !!switcherEl;      // a refresh must not steal focus back
  closeSwitcher();
  const menu = document.createElement("div");
  menu.className = "switcher";
  menu.setAttribute("role", "menu");

  const only = Object.keys(state.boards).length < 2;

  Object.keys(state.boards).forEach(id => {
    const b = state.boards[id];

    const item = document.createElement("div");
    item.className = "switcher-item";

    const row = document.createElement("button");
    row.type = "button";
    row.className = "switcher-row";
    row.setAttribute("role", "menuitem");
    row.dataset.boardId = id;
    if (id === state.currentBoardId) row.setAttribute("aria-current", "true");

    const name = document.createElement("span");
    name.className = "switcher-name";
    name.textContent = b.title || "Untitled";

    const count = document.createElement("span");
    count.className = "switcher-count";
    count.textContent = cardCountLabel(b);

    row.appendChild(name);
    row.appendChild(count);
    /* Jumping is not walking, so the trail restarts here. This is also the
       only route back to a board whose link card has been deleted. */
    row.addEventListener("click", () => navigateTo(id, { trail: "reset" }));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "switcher-del";
    del.textContent = "×";
    del.disabled = only;
    del.title = only ? "The only board cannot be deleted" : "Delete “" + name.textContent + "”";
    del.setAttribute("aria-label", del.title);
    del.addEventListener("click", e => { e.stopPropagation(); deleteBoard(id); });

    item.appendChild(row);
    item.appendChild(del);
    menu.appendChild(item);
  });

  const sep = document.createElement("div");
  sep.className = "switcher-sep";
  menu.appendChild(sep);

  const add = document.createElement("button");
  add.type = "button";
  add.className = "switcher-row switcher-new";
  add.setAttribute("role", "menuitem");
  add.id = "newBoardBtn";
  add.textContent = "+  New board";
  add.addEventListener("click", newStandaloneBoard);
  menu.appendChild(add);

  document.body.appendChild(menu);
  switcherEl = menu;
  boardsBtn.setAttribute("aria-expanded", "true");

  const r = boardsBtn.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + "px";
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.width - 8)) + "px";
  if (!wasOpen) menu.querySelector("button").focus();
}

/* Standalone: no card anywhere points at it. Reachable only from here. */
function newStandaloneBoard() {
  const id = uid("b");
  applyChange(() => {
    state.boards[id] = { id: id, title: "New board", cards: [] };
  });
  navigateTo(id, { trail: "reset" });
  /* The top bar title is this board's rename affordance — same trick as the
     board card, no modal. */
  titleInput.focus();
  titleInput.select();
}

/* Deleting a board never deletes anything that points at it: cards holding
   its id simply become broken links, which already render as such. */
function deleteBoard(id) {
  const board = state.boards[id];
  if (!board) return;
  if (Object.keys(state.boards).length < 2) {
    toast("That is the only board left.");
    return;
  }
  const name = board.title || "Untitled";
  const wasCurrent = id === state.currentBoardId;

  applyChange(() => {
    delete state.boards[id];
    if (wasCurrent) state.currentBoardId = Object.keys(state.boards)[0];
  });

  if (wasCurrent) {
    trail = [state.currentBoardId];
    displayedBoardId = null;         // force a scroll restore for the new board
    render();
  }
  closeSwitcher();
  toast("Deleted “" + name + "” — undo to bring it back");
}

/* ---------------------------------------------------------------------------
   Drag
   Moves the element with transform during the gesture — starting from
   translate(0,0) means there is no jump on grab — and commits x/y to state
   exactly once, on pointerup.
--------------------------------------------------------------------------- */

function startDrag(e, card, el, grip) {
  if (e.button > 0) return;
  select(card.id);
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);

  const startX = e.clientX, startY = e.clientY;
  const startScrollL = scroller.scrollLeft, startScrollT = scroller.scrollTop;
  const originX = card.x, originY = card.y;
  let nx = originX, ny = originY, moved = false;

  /* Drop targets for moving this card to another board: every board card on
     this board except the one being dragged, and except any that points back
     at the board we are already on. Measured once — nothing else moves. */
  const scrollerRect = scroller.getBoundingClientRect();
  const dropTargets = currentBoard().cards.filter(c =>
    c.type === "board" &&
    c.id !== card.id &&
    c.targetBoardId !== state.currentBoardId &&
    !!state.boards[c.targetBoardId]
  );
  let dropOn = null;

  el.classList.add("dragging");

  const onMove = ev => {
    const dx = (ev.clientX - startX) + (scroller.scrollLeft - startScrollL);
    const dy = (ev.clientY - startY) + (scroller.scrollTop  - startScrollT);
    if (!moved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) moved = true;
    nx = clamp(originX + dx, 0, CANVAS_SIZE - card.w);
    ny = clamp(originY + dy, 0, CANVAS_SIZE - card.h);
    el.style.transform = "translate(" + (nx - originX) + "px," + (ny - originY) + "px)";

    /* Hit-test the pointer, not the card, so the aim matches the finger.
       Front to back, so the topmost board card wins. */
    const px = scroller.scrollLeft + (ev.clientX - scrollerRect.left);
    const py = scroller.scrollTop  + (ev.clientY - scrollerRect.top);
    let hit = null;
    for (let i = dropTargets.length - 1; i >= 0; i--) {
      const t = dropTargets[i];
      if (px >= t.x && px <= t.x + t.w && py >= t.y && py <= t.y + t.h) { hit = t; break; }
    }
    if (hit !== dropOn) {
      if (dropOn) elements.get(dropOn.id)?.classList.remove("drop-into");
      dropOn = hit;
      if (dropOn) elements.get(dropOn.id)?.classList.add("drop-into");
      el.classList.toggle("will-move", !!dropOn);
    }
  };

  const onEnd = () => {
    grip.removeEventListener("pointermove", onMove);
    grip.removeEventListener("pointerup", onEnd);
    grip.removeEventListener("pointercancel", onEnd);
    el.classList.remove("dragging", "will-move");
    el.style.transform = "";
    if (dropOn) elements.get(dropOn.id)?.classList.remove("drop-into");
    if (!moved) { dropOn = null; return; }

    if (dropOn) { moveCardToBoard(card.id, dropOn.targetBoardId); dropOn = null; return; }

    applyChange(() => {
      const target = getCard(card.id);
      if (!target) return;
      target.x = Math.round(nx);
      target.y = Math.round(ny);
    });
  };

  grip.addEventListener("pointermove", onMove);
  grip.addEventListener("pointerup", onEnd);
  grip.addEventListener("pointercancel", onEnd);
}

/* ---------------------------------------------------------------------------
   Resize — same shape as drag: visual during, one applyChange on release.
--------------------------------------------------------------------------- */

function startResize(e, card, el, handle) {
  if (e.button > 0) return;
  e.preventDefault();
  e.stopPropagation();
  handle.setPointerCapture(e.pointerId);

  const startX = e.clientX, startY = e.clientY;
  const startScrollL = scroller.scrollLeft, startScrollT = scroller.scrollTop;
  const originW = card.w, originH = card.h;
  const ratio = originW / originH;
  const min = MIN_SIZE[card.type];
  let nw = originW, nh = originH;

  const onMove = ev => {
    const dx = (ev.clientX - startX) + (scroller.scrollLeft - startScrollL);
    const dy = (ev.clientY - startY) + (scroller.scrollTop  - startScrollT);
    let w = clamp(originW + dx, min.w, CANVAS_SIZE - card.x);
    let h = clamp(originH + dy, min.h, CANVAS_SIZE - card.y);

    if (card.type === "image") {          // images keep their aspect ratio
      h = w / ratio;
      if (h < min.h) { h = min.h; w = h * ratio; }
      if (h > CANVAS_SIZE - card.y) { h = CANVAS_SIZE - card.y; w = h * ratio; }
    }

    nw = w; nh = h;
    el.style.width  = w + "px";
    el.style.height = h + "px";
  };

  const onEnd = () => {
    handle.removeEventListener("pointermove", onMove);
    handle.removeEventListener("pointerup", onEnd);
    handle.removeEventListener("pointercancel", onEnd);
    if (Math.round(nw) === originW && Math.round(nh) === originH) return;
    applyChange(() => {
      const target = getCard(card.id);
      if (!target) return;
      target.w = Math.round(nw);
      target.h = Math.round(nh);
    });
  };

  handle.addEventListener("pointermove", onMove);
  handle.addEventListener("pointerup", onEnd);
  handle.addEventListener("pointercancel", onEnd);
}

/* ---------------------------------------------------------------------------
   Card-type picker
--------------------------------------------------------------------------- */

let pickerEl = null;
let pickerOpenedAt = 0;

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function closePicker() {
  if (pickerEl) { pickerEl.remove(); pickerEl = null; }
}

function openPicker(pt) {
  closePicker();
  pickerOpenedAt = Date.now();

  const menu = document.createElement("div");
  menu.className = "picker";
  menu.setAttribute("role", "menu");

  [["text", "Text"], ["list", "List"], ["image", "Image"], ["swatch", "Swatch"],
   ["board", "Board"]]
    .forEach(([type, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "menuitem");
      const dot = document.createElement("span");
      dot.className = "dot";
      b.appendChild(dot);
      b.appendChild(document.createTextNode(label));
      b.addEventListener("click", () => {
        closePicker();
        if (type === "image") {
          pendingImagePoint = pt;
          imageInput.click();
        } else if (type === "board") {
          addBoardCard(pt.x, pt.y);
        } else {
          addCard(type, pt.x, pt.y);
        }
      });
      menu.appendChild(b);
    });

  menu.style.left = pt.x + "px";
  menu.style.top  = pt.y + "px";
  canvas.appendChild(menu);
  pickerEl = menu;

  /* Keep it on screen near the right/bottom edges. */
  const r = menu.getBoundingClientRect();
  if (r.right > window.innerWidth - 8)  menu.style.left = (pt.x - r.width)  + "px";
  if (r.bottom > window.innerHeight - 8) menu.style.top  = (pt.y - r.height) + "px";

  menu.querySelector("button").focus();
}

canvas.addEventListener("dblclick", e => {
  if (e.target !== canvas) return;
  if (Date.now() - pickerOpenedAt < 500) return;   // touch may fire dblclick too
  openPicker(canvasPoint(e));
});

/* Manual double-tap for touch, where dblclick is unreliable. */
let lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener("pointerup", e => {
  if (e.pointerType === "mouse" || e.target !== canvas) return;
  const now = Date.now();
  if (now - lastTap.t < 350 &&
      Math.abs(e.clientX - lastTap.x) < 28 &&
      Math.abs(e.clientY - lastTap.y) < 28) {
    lastTap.t = 0;
    if (now - pickerOpenedAt > 500) openPicker(canvasPoint(e));
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
});

/* ---------------------------------------------------------------------------
   Canvas-level input
--------------------------------------------------------------------------- */

canvas.addEventListener("pointerdown", e => {
  if (e.target !== canvas) return;
  closePicker();
  if (selectedId !== null) { select(null); }
});

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  const key = e.key.toLowerCase();

  if (e.key === "Escape") {
    if (switcherEl) { closeSwitcher(); boardsBtn.focus(); return; }
    if (pickerEl) { closePicker(); return; }
    if (isEditable(document.activeElement)) document.activeElement.blur();
    return;
  }

  if (mod && key === "z") {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && key === "y") {              // Windows-style redo
    e.preventDefault();
    redo();
    return;
  }

  /* Card clipboard and duplicate. All guarded on focus being outside a text
     field, so they never shadow the browser's own text editing. */
  if (!isEditable(document.activeElement)) {
    if (mod && key === "d" && selectedId) { e.preventDefault(); duplicateSelected(); return; }
    if (mod && key === "x" && selectedId) { e.preventDefault(); cutSelected(true);   return; }
    if (mod && key === "c" && selectedId) { e.preventDefault(); cutSelected(false);  return; }
    /* preventDefault stops the paste event firing too, so the image handler
       and this cannot both act on one keystroke. */
    if (mod && key === "v" && cardClipboard) { e.preventDefault(); pasteCard(); return; }
  }

  /* Delete only when focus is outside a text field, or notes get eaten
     while you are editing them. */
  if ((e.key === "Delete" || e.key === "Backspace") &&
      !isEditable(document.activeElement) && selectedId) {
    e.preventDefault();
    deleteCard(selectedId);
  }
});

function isEditable(node) {
  if (!node) return false;
  const tag = node.tagName;
  return tag === "TEXTAREA" || tag === "INPUT" || node.isContentEditable === true;
}

/* ---------------------------------------------------------------------------
   Images

   PROTOTYPE SHORTCUT — images are stored inline as data URLs on the card, so
   the whole board is one JSON blob. The real app must store binary blobs
   separately (IndexedDB / object store) and keep only a reference on the
   card; data URLs bloat every history snapshot and every export. Do not
   carry this across.
--------------------------------------------------------------------------- */

const IMAGE_MAX_EDGE = 320;
let pendingImagePoint = null;

function addImageFile(file, pt) {
  if (!file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onerror = () => toast("Could not read that file.");
  reader.onload = () => {
    const dataUrl = String(reader.result);
    const img = new Image();
    img.onerror = () => toast("That file is not a readable image.");
    img.onload = () => {
      const scale = Math.min(1, IMAGE_MAX_EDGE / img.naturalWidth, IMAGE_MAX_EDGE / img.naturalHeight);
      const w = Math.max(MIN_SIZE.image.w, Math.round(img.naturalWidth  * scale));
      const h = Math.max(MIN_SIZE.image.h, Math.round(img.naturalHeight * scale));
      addCard("image", pt.x, pt.y, { dataUrl, alt: file.name || "", w, h });
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
}

function addImageFiles(files, pt) {
  Array.from(files)
    .filter(f => f.type.startsWith("image/"))
    .forEach((f, i) => addImageFile(f, { x: pt.x + i * 24, y: pt.y + i * 24 }));
}

["dragenter", "dragover"].forEach(type => {
  scroller.addEventListener(type, e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    canvas.classList.add("drop-active");
  });
});

scroller.addEventListener("dragleave", e => {
  if (e.relatedTarget && scroller.contains(e.relatedTarget)) return;
  canvas.classList.remove("drop-active");
});

scroller.addEventListener("drop", e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  canvas.classList.remove("drop-active");
  addImageFiles(e.dataTransfer.files, canvasPoint(e));
});

document.addEventListener("paste", e => {
  if (!e.clipboardData) return;
  const files = Array.from(e.clipboardData.files || []).filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  addImageFiles(files, viewportCentre("image"));
});

imageInput.addEventListener("change", () => {
  const pt = pendingImagePoint || viewportCentre("image");
  pendingImagePoint = null;
  if (imageInput.files.length) addImageFiles(imageInput.files, pt);
  imageInput.value = "";
});

/* ---------------------------------------------------------------------------
   Export / Import — the only persistence in the prototype
--------------------------------------------------------------------------- */

document.getElementById("exportBtn").addEventListener("click", () => {
  commitEdit();
  /* The whole state, so nesting survives the round trip. Named after the
     first board in the map, since the file is every board, not the one
     currently on screen. */
  const rootTitle = state.boards[Object.keys(state.boards)[0]].title;
  const slug = (rootTitle || "boards").trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "boards";
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = slug + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Exported " + slug + ".json");
});

document.getElementById("importBtn").addEventListener("click", () => jsonInput.click());

jsonInput.addEventListener("change", () => {
  const file = jsonInput.files[0];
  jsonInput.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast("Could not read that file.");
  reader.onload = () => {
    let incoming, migrated;
    try {
      const raw = JSON.parse(String(reader.result));
      migrated = isLegacyBoardFile(raw);
      incoming = normaliseState(raw);
    } catch (err) {
      toast("Not a valid board file.");
      return;
    }
    applyChange(() => { state = incoming; });
    selectedId = null;
    trail = [state.currentBoardId];
    backStack.length = 0;
    scrollMemory.clear();          // positions from the previous document
    displayedBoardId = null;
    titleInput.value = currentBoard().title;
    render();
    scrollToContent();
    const n = Object.keys(state.boards).length;
    toast((migrated ? "Migrated " : "Imported ") + n + " board" + (n === 1 ? "" : "s"));
  };
  reader.readAsText(file);
});

const num = (v, fallback) => (typeof v === "number" && isFinite(v) ? v : fallback);
const str = (v, fallback) => (typeof v === "string" ? v : fallback);

/* The pre-addendum export shape: a single bare board, no `boards` map. */
function isLegacyBoardFile(raw) {
  return !!raw && typeof raw === "object" && Array.isArray(raw.cards) && !raw.boards;
}

function normaliseState(raw) {
  if (!raw || typeof raw !== "object") throw new Error("Not a board file");

  /* Migrate an old single-board export: wrap it into `boards` under its own
     id and make it current, so files exported before this change still open. */
  if (isLegacyBoardFile(raw)) {
    const board = normaliseBoard(raw);
    const boards = {};
    boards[board.id] = board;
    return { currentBoardId: board.id, boards: boards };
  }

  if (!raw.boards || typeof raw.boards !== "object") throw new Error("Not a board file");
  const boards = {};
  Object.keys(raw.boards).forEach(key => {
    const board = normaliseBoard(raw.boards[key], key);
    boards[board.id] = board;
  });
  if (!Object.keys(boards).length) throw new Error("No boards");

  let current = str(raw.currentBoardId, "");
  if (!boards[current]) current = Object.keys(boards)[0];
  return { currentBoardId: current, boards: boards };
}

function normaliseBoard(raw, fallbackId) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.cards)) {
    throw new Error("Not a board");
  }
  const cards = raw.cards.map(c => {
    const type = CARD_TYPES.includes(c && c.type) ? c.type : "text";
    const min = MIN_SIZE[type];
    const card = {
      id: str(c.id, "") || uid("c"),
      type,
      x: clamp(num(c.x, 40), 0, CANVAS_SIZE),
      y: clamp(num(c.y, 40), 0, CANVAS_SIZE),
      w: Math.max(min.w, num(c.w, DEFAULT_SIZE[type].w)),
      h: Math.max(min.h, num(c.h, DEFAULT_SIZE[type].h))
    };

    if (type === "text") {
      card.text = str(c.text, "");
    }
    if (type === "list") {
      card.checkable = !!c.checkable;
      const items = Array.isArray(c.items) ? c.items : [];
      card.items = items.length
        ? items.map(i => ({ id: str(i && i.id, "") || uid("i"), text: str(i && i.text, ""), checked: !!(i && i.checked) }))
        : [{ id: uid("i"), text: "", checked: false }];
    }
    if (type === "image") {
      /* Only inline data URLs. A remote http(s) src in an imported file would
         make the page fetch from the network, which this prototype must not do. */
      const url = str(c.dataUrl, "");
      card.dataUrl = /^data:image\//i.test(url) ? url : "";
      card.alt = str(c.alt, "");
    }
    if (type === "swatch") {
      const colour = str(c.colour, "");
      card.colour = /^#[0-9a-f]{6}$/i.test(colour) ? colour : "#c9a227";
      card.label = str(c.label, "");
    }
    if (type === "board") {
      /* Kept even when it resolves to nothing — the card renders as a broken
         link rather than being silently dropped. */
      card.targetBoardId = str(c.targetBoardId, "");
    }
    return card;
  });

  const id = str(raw.id, "") || str(fallbackId, "") || uid("b");
  return { id: id, title: str(raw.title, "Untitled board"), cards: cards };
}

/* ---------------------------------------------------------------------------
   Board title — same focus/type/blur history rule as card text
--------------------------------------------------------------------------- */

titleInput.addEventListener("focus", stashEdit);
titleInput.addEventListener("input", () => {
  stashEdit();
  currentBoard().title = titleInput.value;
});
titleInput.addEventListener("blur", commitEdit);
titleInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); titleInput.blur(); }
});

/* ---------------------------------------------------------------------------
   Toolbar
--------------------------------------------------------------------------- */

document.querySelectorAll("[data-add]").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.add;
    const pt = viewportCentre(type);
    if (type === "image") { pendingImagePoint = pt; imageInput.click(); return; }
    if (type === "board") { addBoardCard(pt.x, pt.y); return; }
    addCard(type, pt.x, pt.y);
  });
});

undoBtn.addEventListener("click", undo);
redoBtn.addEventListener("click", redo);

backBtn.addEventListener("click", goBack);

boardsBtn.addEventListener("click", () => {
  if (switcherEl) closeSwitcher(); else openSwitcher();
});

document.addEventListener("pointerdown", e => {
  if (!switcherEl) return;
  if (switcherEl.contains(e.target) || boardsBtn.contains(e.target)) return;
  closeSwitcher();
}, true);

/* ---------------------------------------------------------------------------
   Toast
--------------------------------------------------------------------------- */

let toastTimer = null;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}

/* ---------------------------------------------------------------------------
   Boot
--------------------------------------------------------------------------- */

function scrollToContent() {
  const cards = currentBoard().cards;
  if (!cards.length) {
    scroller.scrollLeft = 80;
    scroller.scrollTop  = 80;
    return;
  }
  const minX = Math.min(...cards.map(c => c.x));
  const minY = Math.min(...cards.map(c => c.y));
  scroller.scrollLeft = Math.max(0, minX - 56);
  scroller.scrollTop  = Math.max(0, minY - 56);
}
